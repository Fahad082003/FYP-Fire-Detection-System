{% extends "sentinel/shell.html" %}
{% block title %}Dashboard · Sentinel{% endblock %}
{% block page %}
<main class="page page-dashboard">
  <section class="building-status bs-warn" id="building-status" aria-label="Building status">
    <div class="bs-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></div>
    <div class="grow" role="status" aria-live="polite"><div class="bs-title" data-title>Checking…</div><div class="bs-text" data-text>Waiting for the live link.</div></div>
    <div class="bs-actions" data-actions></div>
    <div class="bs-date" id="today"></div>
  </section>

  <div class="kpis" id="kpis" aria-label="Devices and incidents"></div>

  <section class="panel" id="attention-panel" aria-labelledby="attention-title">
    <h2 id="attention-title" class="section-title">Needs your attention</h2>
    <ul class="attention" id="attention"><li class="attention-ok">Checking…</li></ul>
  </section>

  <section aria-labelledby="feeds-title" class="dash-cameras">
    <div class="section-head"><h2 id="feeds-title" class="section-title">Cameras</h2><a href="{% url 'cameras' %}">See all</a></div>
    <div id="video-wall" class="wall-compact"><p class="empty">Loading cameras…</p></div>
  </section>
</main>
{% endblock %}
