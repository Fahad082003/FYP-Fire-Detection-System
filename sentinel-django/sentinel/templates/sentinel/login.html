{% extends "sentinel/base.html" %}
{% block title %}Sign in · Sentinel{% endblock %}
{% block body %}
<main class="login">
  <form method="post" class="panel" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 5 6.5 5 9.5a5 5 0 0 1-10 0C7 9.5 9 7 12 3z"/></svg></span>
      <div><h1>Sentinel</h1><p class="small muted">Fire Safety</p></div>
    </div>
    <p class="dim">Sign in to see your building.</p>
    <label class="field"><span>Email</span>
      <input class="input" type="email" name="email" value="{{ form.email.value|default_if_none:'' }}" autocomplete="username"
             placeholder="admin@sentinel.local" required {% if form.email.errors %}aria-invalid="true"{% endif %}>
      {% for e in form.email.errors %}<span class="error">{{ e }}</span>{% endfor %}</label>
    <label class="field"><span>Password</span>
      <input class="input" type="password" name="password" autocomplete="current-password" required minlength="6"
             {% if form.password.errors %}aria-invalid="true"{% endif %}>
      {% for e in form.password.errors %}<span class="error">{{ e }}</span>{% endfor %}</label>
    {% if error %}<p class="alert-box" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
  </form>
</main>
{% endblock %}
